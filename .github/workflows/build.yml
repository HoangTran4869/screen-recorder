name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package with official signed Python (no self-made exe)
        shell: pwsh
        run: |
          trap { Write-Host "::error::$($_.InvocationInfo.ScriptLineNumber): $_"; exit 1 }
          $v = python -c "import platform;print(platform.python_version())"
          $base = python -c "import sys;print(sys.base_prefix)"
          $app = "QuayManHinh/app"
          New-Item -ItemType Directory $app -Force | Out-Null

          # Python chinh hang (ban nhung) + tkinter
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip $app
          Copy-Item -Recurse "$base/Lib/tkinter" "$app/tkinter"
          Copy-Item "$base/DLLs/_tkinter.pyd", "$base/DLLs/*.dll" $app -Force
          Copy-Item -Recurse "$base/tcl" "$app/tcl"
          Remove-Item -Recurse -Force "$app/tkinter/test", "$app/tcl/tix*" -ErrorAction SilentlyContinue

          # ffmpeg
          try {
            Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ff.zip
          } catch {
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          }
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName $app

          # Ma nguon + file bam dup de mo
          Copy-Item app.py "$app/app.pyw"
          Copy-Item icon.ico $app
          Copy-Item launcher.bat "QuayManHinh/Mo-QuayManHinh.bat"
          Copy-Item README.md "QuayManHinh/HUONG-DAN.txt"

          # Kiem tra tkinter chay duoc
          $env:TCL_LIBRARY = (Resolve-Path "$app/tcl/tcl8.6").Path
          $out = & "$app/python.exe" -c "import tkinter; print('Tcl', tkinter.Tcl().eval('info patchlevel'))" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::tkinter test: $($out -replace "`r?`n", ' | ')"; exit 1 }

          Compress-Archive QuayManHinh QuayManHinh.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Quay Màn Hình v1.${{ github.run_number }}
          body: Tải file **QuayManHinh.zip** bên dưới, giải nén, rồi bấm đúp **Mo-QuayManHinh.bat**.
          files: QuayManHinh.zip
          make_latest: true
